name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sign:
    name: sign
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Verify signing contract
        run: |
          rustc -O -o sign_check scripts/sign_check.rs
          ./sign_check

      - name: Cross check with python hmac
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json
          v = json.load(open('analysis/sign_vectors.json'))
          for case in v['vectors']:
              want = hmac.new(v['sign_key'].encode(), case['payload'].encode(), hashlib.sha256).hexdigest()
              assert want == case['signature'], (case['name'], want, case['signature'])
              print(case['name'], 'ok', want)
          PY

  client:
    name: client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy rustfmt
          rustup default stable
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets -- --nocapture

      - name: Build
        run: cargo build --release --all-targets

      - name: Sign self check
        run: |
          cargo run --release --bin login_probe -- sign \
            --path /api/v1/login/check_uu_token \
            --method POST \
            --body '{}' \
            --ts 1700000000

  proto:
    name: proto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Regenerate from schema
        run: |
          mkdir -p /tmp/regen
          python3 scripts/gen_proto.py analysis/schema.json -o /tmp/regen

      - name: Compare with repository
        run: |
          status=0
          for item in /tmp/regen/*.proto; do
            name=$(basename "$item")
            if ! diff -q "proto/$name" "$item" > /dev/null; then
              echo "::error file=proto/$name::differs from schema.json"
              diff "proto/$name" "$item" || true
              status=1
            fi
          done
          exit $status

      - name: Compile
        run: |
          mkdir -p /tmp/pbout
          protoc --cpp_out=/tmp/pbout -Iproto proto/*.proto
          echo compiled

      - name: Descriptor set
        run: |
          mkdir -p dist
          protoc --include_imports --descriptor_set_out=dist/gv_pb.desc -Iproto proto/*.proto
          protoc --decode_raw < dist/gv_pb.desc > /dev/null
          wc -c dist/gv_pb.desc

      - name: Python roundtrip
        run: |
          pip install --quiet 'protobuf>=4.25'
          mkdir -p /tmp/pymods
          protoc --python_out=/tmp/pymods -Iproto proto/*.proto
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/pymods')
          import main_pb2, defines_pb2, input_event_pb2

          msg = main_pb2.Message()
          msg.seq = 4242
          msg.timestamp = 1700000000
          msg.rpc_request.request_header.request_id = 9
          capture = msg.rpc_request.capture_setting
          capture.fps = defines_pb2.FPS_144
          capture.frame_quality = defines_pb2.VideoQuality_Bluray
          capture.codec_type = defines_pb2.CodecType_H265
          capture.resolution_width = 3840
          capture.resolution_height = 2160
          capture.chorma_format = defines_pb2.ChromaFormat_444

          blob = msg.SerializeToString()
          back = main_pb2.Message()
          back.ParseFromString(blob)
          assert back.seq == 4242
          assert back.rpc_request.request_header.request_id == 9
          assert back.rpc_request.capture_setting.fps == defines_pb2.FPS_144
          assert back.rpc_request.capture_setting.resolution_width == 3840
          assert back.rpc_request.capture_setting.chorma_format == defines_pb2.ChromaFormat_444
          print('message', len(blob), blob.hex())

          event = input_event_pb2.InputEvent()
          event.touch_event.event_type = 5
          point = event.touch_event.touch_points.add()
          point.id, point.x, point.y = 1, 123.5, 456.25
          raw = event.SerializeToString()
          reread = input_event_pb2.InputEvent()
          reread.ParseFromString(raw)
          assert reread.touch_event.touch_points[0].x == 123.5
          print('input', raw.hex())

          assert len(main_pb2.Message.DESCRIPTOR.fields) == 28
          print('arms 28')
          PY

  wire:
    name: wire
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev cmake g++ ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure