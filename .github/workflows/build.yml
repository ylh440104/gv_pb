name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux / protobuf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev cmake g++ ninja-build

      - name: Report versions
        run: |
          protoc --version
          cmake --version | head -1
          g++ --version | head -1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run roundtrip test
        run: ctest --test-dir build --output-on-failure

      - name: Show generated protobuf sources
        run: |
          ls -l build/gen
          echo "--- Message arms in generated code ---"
          grep -c 'kInputEventFieldNumber\|kRpcRequestFieldNumber' build/gen/main.pb.h || true

  python:
    name: python / schema-tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Regenerate proto from committed schema.json
        run: |
          mkdir -p /tmp/regen
          python3 scripts/gen_proto.py analysis/schema.json -o /tmp/regen

      - name: Verify committed proto matches schema.json
        run: |
          fail=0
          for f in /tmp/regen/*.proto; do
            b=$(basename "$f")
            if ! diff -q "proto/$b" "$f" > /dev/null; then
              echo "::error file=proto/$b::regenerated schema differs from committed file"
              diff "proto/$b" "$f" || true
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "committed .proto files match schema.json exactly"

      - name: Compile all recovered .proto
        run: |
          mkdir -p /tmp/pbout
          protoc --cpp_out=/tmp/pbout -Iproto proto/*.proto
          echo "protoc accepted all recovered schema files"

      - name: Emit portable FileDescriptorSet
        run: |
          mkdir -p dist
          protoc --include_imports --descriptor_set_out=dist/gv_pb.desc -Iproto proto/*.proto
          ls -l dist/gv_pb.desc
          protoc --decode_raw < dist/gv_pb.desc > /dev/null
          echo "descriptor set is valid wire format"

      - name: Python roundtrip using generated modules
        run: |
          pip install --quiet protobuf
          mkdir -p /tmp/pymods
          protoc --python_out=/tmp/pymods -Iproto proto/*.proto
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, '/tmp/pymods')
          import main_pb2, session_pb2, input_event_pb2

          m = main_pb2.Message()
          m.seq = 4242
          m.timestamp = 1700000000
          m.rpc_request.request_header.request_id = 9
          cs = m.rpc_request.capture_setting
          cs.fps = session_pb2.FPS_144
          cs.frame_quality = session_pb2.VideoQuality_Bluray
          cs.codec_type = session_pb2.CodecType_H265
          cs.resolution_width = 3840
          cs.resolution_height = 2160
          cs.chorma_format = session_pb2.ChromaFormat_444

          blob = m.SerializeToString()
          back = main_pb2.Message()
          back.ParseFromString(blob)

          assert back.seq == 4242, back.seq
          assert back.rpc_request.request_header.request_id == 9
          assert back.rpc_request.capture_setting.fps == session_pb2.FPS_144
          assert back.rpc_request.capture_setting.resolution_width == 3840
          assert back.rpc_request.capture_setting.chorma_format == session_pb2.ChromaFormat_444
          print('python roundtrip OK: %d bytes' % len(blob))
          print('hex:', blob.hex())

          ie = input_event_pb2.InputEvent()
          ie.touch_event.event_type = 5
          p = ie.touch_event.touch_points.add()
          p.id, p.x, p.y = 1, 123.5, 456.25
          blob2 = ie.SerializeToString()
          back2 = input_event_pb2.InputEvent()
          back2.ParseFromString(blob2)
          assert back2.touch_event.touch_points[0].x == 123.5
          print('input_event roundtrip OK:', blob2.hex())

          d = main_pb2.Message.DESCRIPTOR
          print('Message arms present:', len(d.fields))
          assert len(d.fields) == 28, len(d.fields)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: gvpb-proto-and-descriptor
          path: |
            dist/gv_pb.desc
            proto/*.proto
            analysis/schema.json
            analysis/rtti_symbols.txt

  windows:
    name: windows / msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf
        run: vcpkg install protobuf:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run roundtrip test
        run: ctest --test-dir build -C Release --output-on-failure