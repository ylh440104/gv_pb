name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          cargo --version
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets --release

      - name: Test
        run: cargo test --all-targets -- --nocapture

      - name: Signature self-check
        run: |
          cargo run --release --bin login_probe -- sign \
            --path /api/v1/login/check_uu_token \
            --method POST \
            --body '{}' \
            --ts 1700000000 \
            --device-id dev --client-id cli --system-id sys

  proto:
    name: proto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Rebuild proto from schema
        run: |
          mkdir -p /tmp/regen
          python3 scripts/gen_proto.py analysis/schema.json -o /tmp/regen

      - name: Compare with committed proto
        run: |
          status=0
          for f in /tmp/regen/*.proto; do
            name=$(basename "$f")
            if ! diff -q "proto/$name" "$f" > /dev/null; then
              echo "::error file=proto/$name::does not match schema.json"
              diff "proto/$name" "$f" || true
              status=1
            fi
          done
          exit $status

      - name: Compile proto
        run: |
          mkdir -p /tmp/pbout
          protoc --cpp_out=/tmp/pbout -Iproto proto/*.proto
          echo "protoc accepted every file"

      - name: Descriptor set
        run: |
          mkdir -p dist
          protoc --include_imports --descriptor_set_out=dist/gv_pb.desc -Iproto proto/*.proto
          protoc --decode_raw < dist/gv_pb.desc > /dev/null
          ls -l dist/gv_pb.desc

      - name: Python roundtrip
        run: |
          pip install --quiet 'protobuf>=4.25'
          mkdir -p /tmp/pymods
          protoc --python_out=/tmp/pymods -Iproto proto/*.proto
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/pymods')
          import main_pb2, defines_pb2, input_event_pb2

          m = main_pb2.Message()
          m.seq = 4242
          m.timestamp = 1700000000
          m.rpc_request.request_header.request_id = 9
          cs = m.rpc_request.capture_setting
          cs.fps = defines_pb2.FPS_144
          cs.frame_quality = defines_pb2.VideoQuality_Bluray
          cs.codec_type = defines_pb2.CodecType_H265
          cs.resolution_width = 3840
          cs.resolution_height = 2160
          cs.chorma_format = defines_pb2.ChromaFormat_444

          blob = m.SerializeToString()
          back = main_pb2.Message()
          back.ParseFromString(blob)
          assert back.seq == 4242
          assert back.rpc_request.request_header.request_id == 9
          assert back.rpc_request.capture_setting.fps == defines_pb2.FPS_144
          assert back.rpc_request.capture_setting.resolution_width == 3840
          assert back.rpc_request.capture_setting.chorma_format == defines_pb2.ChromaFormat_444
          print('message roundtrip ok', len(blob), blob.hex())

          ie = input_event_pb2.InputEvent()
          ie.touch_event.event_type = 5
          pt = ie.touch_event.touch_points.add()
          pt.id, pt.x, pt.y = 1, 123.5, 456.25
          raw = ie.SerializeToString()
          reread = input_event_pb2.InputEvent()
          reread.ParseFromString(raw)
          assert reread.touch_event.touch_points[0].x == 123.5
          print('input roundtrip ok', raw.hex())

          assert len(main_pb2.Message.DESCRIPTOR.fields) == 28
          print('envelope arms ok')
          PY

  cpp:
    name: cpp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev cmake g++ ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure