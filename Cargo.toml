[package]
name = "gvpb-login"
version = "0.1.0"
edition = "2021"
description = "NRD signing and login probe derived from GameViewerServer static analysis"
license = "MIT OR Apache-2.0"

[lib]
name = "gvpb_login"
path = "src/lib.rs"

[[bin]]
name = "login_probe"
path = "src/bin/login_probe.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }