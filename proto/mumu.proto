syntax = "proto3";

package gv_pb;

enum enumMumuNotifyType {
  kMumuNotifyLaunch = 0;
  kMumuNotifyShutdown = 1;
  kMumuNotifyRestart = 2;
  kMumuNotifyDelete = 3;
  kMumuNotifyCreate = 4;
  kMumuNotifyCopy = 5;
  kMumuNotifyPlayerCrash = 6;
  kMumuNotifyPlayerHeadlessCrash = 7;
}

enum enumMumuErrorCode {
  kMumuErrorCodeSuccess = 0;
  kMumuErrorCodeFailed = 1;
}

message MumuInfo {
  enum enumRunStatus {
    kMumuRunStatusNotRun = 0;
    kMumuRunStatusProcessStart = 1;
    kMumuRunStatusCompleteCommunication = 2;
    kMumuRunStatusAndroidComplete = 3;
    kMumuRunStatusClosing = 4;
    kMumuRunStatusLaunchFailed = 5;
  }
  int32 vm_index = 1;
  string name = 2;
  enumRunStatus run_status = 3;
}

message MumuPlayerList {
  bool get_all = 1;
  repeated MumuInfo list_info = 2;
  repeated int32 list_vm_index = 3;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message LanguageValue {
  string value = 1;
  string language_value = 2;
}

message LanguageKeyValue {
  string key = 1;
  LanguageValue value = 2;
}

message OneKeyMultiValue {
  string key = 1;
  string current_value = 2;
  repeated LanguageValue list_value = 3;
}

message Performance {
  string value = 1;
  string language_value = 2;
  string cpu_core_num = 3;
  string mem_value = 4;
}

message SettingRangePerformance {
  string key = 1;
  string key_custom_cpu = 2;
  string key_custom_mem = 3;
  string current_value = 4;
  string current_custom_cpu = 5;
  string current_custom_mem = 6;
  repeated string list_range_custom_cpu = 7;
  repeated string list_range_custom_mem = 8;
  repeated Performance list_performance = 9;
}

message MinMax {
  int32 min = 1;
  int32 max = 2;
}

message Resolution {
  string value = 1;
  string width = 2;
  string height = 3;
  string dpi = 4;
}

message SettingRangeResolution {
  string key = 1;
  string key_custom_resolution_width = 2;
  string key_custom_resolution_height = 3;
  string key_custom_resolution_dpi = 4;
  string current_value = 5;
  string current_custom_width = 6;
  string current_custom_height = 7;
  string current_custom_dpi = 8;
  MinMax range_resolution_width = 9;
  MinMax range_resolution_height = 10;
  MinMax range_resolution_dpi = 11;
  repeated Resolution list_resolution = 12;
}

message MumuSettingRange {
  int32 vm_index = 1;
  string language = 2;
  OneKeyMultiValue render_list = 3;
  SettingRangePerformance performance_list = 4;
  SettingRangeResolution resolution_list = 5;
}

message MumuSetting {
  enum enumType {
    kMumuSettingLocal = 0;
    kMumuSettingGlobal = 1;
  }
  message MapKeyValueEntry {
    string key = 1;
    string value = 2;
  }
  repeated int32 list_vm_index = 1;
  enumType type = 2;
  bool set_or_get = 3;
  repeated MapKeyValueEntry map_key_value = 4;
  bool get_setting_range = 5;
  MumuSettingRange setting_range = 6;
}

message MumuControl {
  enum enumType {
    kMumuControlLaunch = 0;
    kMumuControlShutdown = 1;
    kMumuControlRestart = 2;
    kMumuControlDelete = 3;
    kMumuControlCreate = 4;
    kMumuControlCopy = 5;
  }
  repeated int32 list_vm_index = 1;
  enumType type = 2;
}

message MumuNotifySimple {
  int32 vm_index = 1;
  enumMumuNotifyType type = 2;
  enumMumuErrorCode error_code = 3;
}

message MumuNotifyProcess {
  int32 vm_index = 1;
  enumMumuNotifyType type = 2;
  int32 progress = 3;
}

message MumuOperate {
  MumuPlayerList player_list = 1;
  MumuControl control = 2;
  MumuSetting setting = 3;
  MumuSettingRange setting_range = 4;
  MumuNotifyProcess notify_process = 5;
  MumuNotifySimple notify_result = 6;
}
